name: Release

# Stages BOTH packages on npm via Trusted Publishing (OIDC): no npm token is
# stored anywhere. CI can only STAGE - a maintainer approves each with 2FA.
#
#   1. npm version patch && git push --follow-tags   (bumps root + both packages)
#   2. npm stage list mongo-axi; npm stage list mongo-rw-axi   (npm >= 12)
#   3. npm stage approve <stage-id>                   (prompts for 2FA)
on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  id-token: write # required for npm trusted publishing

jobs:
  stage:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package: [mongo-axi, mongo-rw-axi]
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: pnpm
      - name: Tag must match the package version
        run: |
          version="v$(node -p "require('./packages/${{ matrix.package }}/package.json').version")"
          if [ "$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match ${{ matrix.package }} $version"
            exit 1
          fi
      # npm never allows re-publishing a version; a hand-published one is not a failure.
      - name: Skip if this version is already on npm
        id: registry
        run: |
          version="$(node -p "require('./packages/${{ matrix.package }}/package.json').version")"
          if npm view "${{ matrix.package }}@$version" version >/dev/null 2>&1; then
            echo "published=true" >> "$GITHUB_OUTPUT"
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.registry.outputs.published == 'false'
        run: pnpm install --frozen-lockfile
      - if: steps.registry.outputs.published == 'false'
        run: pnpm run check
      - if: steps.registry.outputs.published == 'false'
        run: npm install -g npm@latest
      - if: steps.registry.outputs.published == 'false'
        working-directory: packages/${{ matrix.package }}
        run: npm stage publish --ignore-scripts
      - if: steps.registry.outputs.published == 'false'
        name: How to approve
        run: |
          {
            echo "### ${{ matrix.package }} staged, not yet public"
            echo '```sh'
            echo "npm stage list ${{ matrix.package }}"
            echo "npm stage approve <stage-id>"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  github-release:
    needs: stage
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # the notes need the previous tag
      - name: Create the GitHub release for this tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prev="$(git describe --tags --abbrev=0 "$GITHUB_REF_NAME^" 2>/dev/null || true)"
          range="${prev:+$prev..}$GITHUB_REF_NAME"
          changes="$(git log --no-merges --format='- %s (%h)' "$range" | grep -vE '^- v?[0-9]+\.[0-9]+\.[0-9]+ \(' || true)"
          {
            echo "${changes:-Version bump only.}"
            if [ -n "$prev" ]; then
              echo
              echo "**Full Changelog**: https://github.com/$GITHUB_REPOSITORY/compare/$prev...$GITHUB_REF_NAME"
            fi
          } > "$RUNNER_TEMP/notes.md"
          if gh release view "$GITHUB_REF_NAME" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release edit "$GITHUB_REF_NAME" -R "$GITHUB_REPOSITORY" --notes-file "$RUNNER_TEMP/notes.md"
          else
            gh release create "$GITHUB_REF_NAME" -R "$GITHUB_REPOSITORY" --verify-tag --title "$GITHUB_REF_NAME" --notes-file "$RUNNER_TEMP/notes.md"
          fi
